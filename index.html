   <div class="collection"><div class="sectionHead"><div><h2>おさかな図鑑</h2><div class="sub">集めたカードはここに並ぶよ</div></div></div><div class="cards" id="cards"></div></div>
  </section>
 </div><p class="smallprint">試作版：現地QRコードの代わりに「ここでチェックイン」ボタンで進めます。<br>実際のスポット間の距離・移動方法は、公開前に確認して設定します。</p>
</main>
<div class="toast" id="toast" role="status"></div><div class="modal" id="modal"><div class="dialog"><div class="big" id="modalFish">🐟</div><h2 id="modalTitle">ゲーム終了</h2><p id="modalText"></p><button class="btn primary" id="closeModal">つぎへ</button></div></div>
<script>
(()=>{
const fishSet=[{icon:'maguro',name:'クロマグロ',fact:'クロマグロは広い海を回遊する大型のマグロだよ。'},{icon:'iwashin',name:'イワシん',fact:'氷見鰯にはマイワシ・カタクチイワシ・ウルメイワシがいるよ。'},{icon:'buri',name:'ブリ',fact:'氷見の冬を代表する魚。成長に合わせて呼び名が変わるよ。'},{icon:'squid',name:'アオリイカ',fact:'大きなヒレを使って泳ぐ、イカの仲間だよ。'},{icon:'amaebi',name:'甘エビ',fact:'富山湾でも親しまれている、甘みのあるエビだよ。'},{icon:'oyster',name:'岩牡蠣',fact:'夏に旬を迎える大きな牡蠣。海の栄養をたっぷり蓄えるよ。'}];
const spots=[{name:'ひみ番屋街',kind:'海の幸に出会う場所',icon:'🏮',fish:[3,4],fact:'氷見の旬の魚や食文化に出会える場所。どんな魚が並んでいるか探してみよう！'},{name:'氷見漁港',kind:'魚が水揚げされる港',icon:'⚓',fish:[0,1],fact:'氷見漁港には四季を通じて多様な魚が水揚げされるよ。春のイワシ、夏のマグロ、冬のブリが有名！'},{name:'比美乃江公園',kind:'海と立山を眺める場所',icon:'🌊',fish:[2,5],fact:'海の向こうに立山連峰を望めるスポット。氷見の海と山の景色を楽しもう！'}];
const modes=[{id:'score',name:'スコアアタック',moves:30,goal:0,count:6,desc:'30手でどこまでスコアを伸ばせるか挑戦。自己ベストを保存するよ。'},{id:'easy',name:'イージー',moves:20,goal:3000,count:6,desc:'20手で3,000点をめざそう。まずは遊び方に慣れたい人向け。'},{id:'normal',name:'ノーマル',moves:18,goal:6000,count:6,desc:'18手で6,000点をめざそう。連鎖を作ると魚カード獲得に近づくよ。'},{id:'hard',name:'ハード',moves:16,goal:8500,count:6,desc:'16手で8,500点。連鎖と特殊コマを活用しよう。'},{id:'expert',name:'エキスパート',moves:14,goal:11000,count:6,desc:'14手で11,000点。大きな消しと連鎖が必要な上級モード。'},{id:'fishhell',name:'フィッシュヘル',moves:12,goal:14000,count:6,desc:'12手で14,000点。連鎖と特殊コマを極める最難関モード。'},{id:'fishheaven',name:'フィッシュヘブン',moves:18,goal:12000,count:6,desc:'18手で12,000点。7列の盤面で連鎖を楽しむモード。'}];
let visited=JSON.parse(localStorage.getItem('iwashinVisitedSpecies')||'[]'),current=-1,active=false,board=[],specials=[],selected=null,score=0,moves=0,busy=false,modeId='score',maxCombo=0,maxMatch=0,bigClears=0,specialAnchor=null;
const $=id=>document.getElementById(id),save=()=>localStorage.setItem('iwashinVisitedSpecies',JSON.stringify(visited)),mode=()=>modes.find(m=>m.id===modeId),bestKey=id=>'iwashinBest_'+id;
function fishIcon(icon){if(icon==='iwashin')return '<img class="iwashinSprite" src="iwashin-character.jpg" alt="イワシん">';const names={maguro:'クロマグロ',buri:'ブリ',squid:'アオリイカ',amaebi:'甘エビ',oyster:'岩牡蠣'};return `<span class="seaIcon icon-${icon}" role="img" aria-label="${names[icon]||icon}"></span>`}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)}
function iwashinSays(text){$('iwashinComment').textContent=text;const avatar=$('iwashinMini');avatar.classList.remove('cheer');void avatar.offsetWidth;avatar.classList.add('cheer')}
function commentForClear(info,depth,specialCount){if(moves===0&&depth===1)return '最後の一手です！イワシんと一緒に決めよう！';const kinds=[...new Set([...info.cells].map(i=>board[i]).filter(v=>v!==null))];const kind=kinds[Math.floor(Math.random()*kinds.length)]??1;const lines={0:['クロマグロが大漁！','マグロパワーで大きく消えたよ！','クロマグロ、迫力満点！'],1:['イワシんが消えた！元気を分けてくれたよ！','イワシんと一緒に大漁だー！','イワシんパワー全開！'],2:['ブリが消えた！出世魚パワー！','ブリの勢いで次もそろえよう！','ブリっと大漁！'],3:['アオリイカがスイスイ消えた！','イカした消し方だね！','アオリイカ、するっと消えたよ！'],4:['甘エビがぷりっと消えたよ！','甘エビパワー！次もそろえよう！','甘エビ、大漁だね！'],5:['岩牡蠣が消えた！うまみたっぷり！','岩牡蠣も大喜び！','岩牡蠣パワーで海の幸！']};const line=lines[kind][Math.floor(Math.random()*lines[kind].length)];if(depth>1)return `${depth}コンボ！${line}${specialCount?' 特殊コマも発動！':''}`;if(specialCount)return `${line} 特殊コマ発動！`;return line}
function renderModes(){ $('modePick').innerHTML=modes.map(m=>`<button type="button" class="${m.id===modeId?'active':''}" data-mode="${m.id}" ${active?'disabled':''}>${m.name}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(active)return;modeId=b.dataset.mode;renderModes();$('modeInfo').textContent=mode().desc;$('bestScore').textContent=localStorage.getItem(bestKey(modeId))||'0';$('goalText').textContent=mode().id==='score'?'🐟 30手のスコア勝負':`🎯 目標 ${mode().goal.toLocaleString()}点`;$('startBtn').textContent='このモードで開始';});$('modeInfo').textContent=mode().desc;$('bestScore').textContent=localStorage.getItem(bestKey(modeId))||'0';}
function renderSpots(){ $('spots').innerHTML=spots.map((s,i)=>`<div class="spot ${current===i?'active':''} ${i>0&&!visited.includes(i-1)?'locked':''}"><div class="spotIcon">${s.icon}</div><div class="spotBody"><strong>${s.name}</strong><span>${s.kind}</span></div><span class="spotState">${visited.includes(i)?'✅ 達成':i>0&&!visited.includes(i-1)?'🔒':'未挑戦'}</span><button class="spotButton" data-spot="${i}" ${i>0&&!visited.includes(i-1)?'disabled':''}>${visited.includes(i)?'もう一度':'チェックイン'}</button></div>`).join('');document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>checkin(+b.dataset.spot));$('stampBadge').textContent=`🐚 ${visited.length} / 3 スポット`;$('progressText').textContent=`${visited.length} / 3`;$('progressBar').style.width=`${visited.length/3*100}%`;renderCards();}
function renderCards(){ $('cards').innerHTML=fishSet.map((f,i)=>{const spotIndex=spots.findIndex(s=>s.fish.includes(i)),got=visited.includes(spotIndex);return `<div class="fishcard ${got?'got':''}"><span class="fish">${fishIcon(f.icon)}</span><b>${got?f.name:'？？？'}</b><small>${got?'カード獲得！':'スポットで発見'}</small></div>`}).join('');}
function checkin(i){if(active){toast('プレイ中はスポットを変更できないよ');return}current=i;$('gameTitle').textContent=spots[i].name+'のパズル';$('gameSub').textContent=spots[i].kind;$('routeLabel').textContent='スポット '+(i+1)+' / 3';$('fact').innerHTML='<b>この場所の豆知識：</b>'+spots[i].fact;renderSpots();toast(spots[i].name+'にチェックイン！モードを選んでね');}
function randomPiece(){return Math.floor(Math.random()*mode().count)}
function newBoard(){for(let attempt=0;attempt<50;attempt++){board=[];specials=Array(42).fill(null);for(let i=0;i<42;i++){let r=Math.floor(i/7),c=i%7,v,tries=0;do{v=randomPiece();tries++}while(tries<40&&(c>=2&&board[i-1]===v&&board[i-2]===v||r>=2&&board[i-7]===v&&board[i-14]===v));board.push(v)}if(hasValidMove())break}draw();}
const pieceKeys=['maguro','iwashin','buri','squid','amaebi','oyster'];const pieceNames=['クロマグロ','イワシん','ブリ','アオリイカ','甘エビ','岩牡蠣'];function iconPool(){return pieceKeys}
function powerName(type){return {row:'横一列',column:'縦一列',cross:'十字',wild:'全消し'}[type]||''}
function draw(falling=false){const icons=iconPool();$('grid').innerHTML=board.map((v,i)=>{const p=specials[i],cl=p?`power power-${p}`:'';return `<button class="tile ${falling&&v!==null?'falling':''} piece-${v} ${v===null?'empty':''} ${selected===i?'selected':''} ${cl}" data-cell="${i}" data-power="${p==='row'?'↔':p==='column'?'↕':p==='cross'?'✚':p==='wild'?'★':''}" aria-label="${p?powerName(p)+'特殊コマ':pieceNames[v]||'空き'}">${v===null?'':fishIcon(icons[v])}</button>`}).join('');document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>tap(+b.dataset.cell));}
function start(){if(active)return;active=true;document.body.classList.add('playing');iwashinSays('よーし！イワシんと一緒にがんばろう！');score=0;moves=mode().moves;maxCombo=0;maxMatch=0;bigClears=0;selected=null;specialAnchor=null;$('score').textContent='0';$('combo').textContent='0';$('maxClear').textContent='0';$('bigClears').textContent='0';$('goalText').textContent=mode().id==='score'?`🐟 残り ${moves} 手`:`🎯 ${moves}手で ${mode().goal.toLocaleString()}点`;$('startBtn').textContent='プレイ中…';$('startBtn').style.display='none';$('giveUpBtn').style.display='inline-block';$('modePick').querySelectorAll('button').forEach(b=>b.disabled=true);newBoard();toast(mode().name+'開始！');}
function tap(i){if(!active||busy||board[i]===null)return;if(selected===null){selected=i;draw();return}const a=selected,b=i;selected=null;if(Math.abs(a-b)===7||Math.floor(a/7)===Math.floor(b/7)&&Math.abs(a-b)===1){[board[a],board[b]]=[board[b],board[a]];[specials[a],specials[b]]=[specials[b],specials[a]];const info=findMatches();if(info.cells.size){moves--;busy=true;specialAnchor=b;resolve(info,1)}else{[board[a],board[b]]=[board[b],board[a]];[specials[a],specials[b]]=[specials[b],specials[a]];draw();iwashinSays('あれ？そろわなかったね。次いってみよう！');toast('そろわなかったよ。別の組み合わせを探そう！')}}else{selected=i;draw()}}function findMatches(){const cells=new Set(),runs=[];for(let r=0;r<6;r++)for(let c=0;c<7;c++){const i=r*7+c,v=board[i];if(v===null)continue;let run=[i];for(let x=c+1;x<7&&board[r*7+x]===v;x++)run.push(r*7+x);if(run.length>=3){run.forEach(x=>cells.add(x));runs.push({cells:run,axis:'row',value:v})}run=[i];for(let y=r+1;y<6&&board[y*7+c]===v;y++)run.push(y*7+c);if(run.length>=3){run.forEach(x=>cells.add(x));runs.push({cells:run,axis:'column',value:v})}}return {cells,runs}}
function makePower(info,depth=1){const available=[...info.cells].filter(i=>!specials[i]);if(!available.length){specialAnchor=null;return null}const preferred=info.cells.has(specialAnchor)&&!specials[specialAnchor]?specialAnchor:null;let type=null;let run=null;if(info.cells.size>=6)type='cross';else if(info.cells.size>=5)type='wild';else{run=info.runs.filter(x=>x.cells.length>=4).sort((a,b)=>b.cells.length-a.cells.length)[0];if(run)type=run.axis;else if(depth>=4)type='cross';else if(depth===3)type='wild';else if(depth===2){const matchedRun=[...info.runs].sort((a,b)=>b.cells.length-a.cells.length)[0];type=matchedRun?.axis??'row'}}if(!type)return null;if(run){const candidates=run.cells.filter(i=>!specials[i]);if(!candidates.length)return null;const anchor=run.cells.includes(preferred)?preferred:candidates[Math.floor(candidates.length/2)];specialAnchor=null;return {anchor,type}}const anchor=preferred??available[0];specialAnchor=null;return {anchor,type}}
function addPowerCells(cells){const queue=[...cells],queued=new Set(queue),wildValues=new Set();let activated=0;const include=i=>{if(i<0||i>=board.length||board[i]===null)return;cells.add(i);if(!queued.has(i)){queued.add(i);queue.push(i)}};while(queue.length){const i=queue.shift();if(board[i]===null)continue;const type=specials[i];if(!type)continue;activated++;const r=Math.floor(i/7),c=i%7;specials[i]=null;let extra=[];if(type==='row')extra=Array.from({length:7},(_,x)=>r*7+x);else if(type==='column')extra=Array.from({length:6},(_,y)=>y*7+c);else if(type==='cross')extra=[...Array.from({length:7},(_,x)=>r*7+x),...Array.from({length:6},(_,y)=>y*7+c)];else if(type==='wild'){const value=board[i];if(value!==null){wildValues.add(value);board.forEach((v,j)=>{if(v===value)include(j)})}}extra.forEach(include)}return {activated,wildValues:[...wildValues]}}
function resolve(info,depth){if(depth>1){iwashinSays(`${depth}コンボ！連鎖が続いてるよ！`);toast(`${depth}コンボ！`);info.cells.forEach(i=>document.querySelector(`[data-cell="${i}"]`)?.classList.add('match-pop'));setTimeout(()=>resolveStep(info,depth),420);return}resolveStep(info,depth)}
function resolveStep(info,depth){const created=info.runs.length?makePower(info,depth):null;let cells=new Set(info.cells);const powerEffects=addPowerCells(cells),activatedSpecials=powerEffects.activated,matchSize=info.cells.size,totalClear=cells.size;iwashinSays(commentForClear(info,depth,activatedSpecials));if(powerEffects.wildValues.length){const names=powerEffects.wildValues.map(v=>pieceNames[v]||'魚');iwashinSays(`★全消し！${names.join('・')}をぜんぶ消したよ！`);toast(`★全消し！${names.join('・')}`)}maxMatch=Math.max(maxMatch,totalClear);if(totalClear>=6)bigClears++;maxCombo=Math.max(maxCombo,depth);$('combo').textContent='×'+depth;$('maxClear').textContent=maxMatch;$('bigClears').textContent=bigClears;const multiplier=Math.min(depth,5),bonus=matchSize>=6?300:matchSize===5?180:matchSize===4?80:0;score+=cells.size*35*multiplier+bonus+(depth>1?100*depth:0)+activatedSpecials*100;$('score').textContent=score.toLocaleString();cells.forEach(i=>{board[i]=null;specials[i]=null});for(let c=0;c<7;c++){const vals=[];for(let r=5;r>=0;r--)if(board[r*7+c]!==null)vals.push({v:board[r*7+c],p:specials[r*7+c]});while(vals.length<6)vals.push({v:randomPiece(),p:null});if(created&&c===created.anchor%7)vals[5].p=created.type;for(let r=5;r>=0;r--){const item=vals[5-r];board[r*7+c]=item.v;specials[r*7+c]=item.p}}draw(true);setTimeout(()=>{const next=findMatches();if(next.cells.size){resolve(next,depth+1)}else{busy=false;specialAnchor=null;afterMove()}},320)}function hasValidMove(){for(let i=0;i<42;i++){const candidates=[];if(i%7<6)candidates.push(i+1);if(i<35)candidates.push(i+7);for(const j of candidates){[board[i],board[j]]=[board[j],board[i]];const valid=findMatches().cells.size>0;[board[i],board[j]]=[board[j],board[i]];if(valid)return true}}return false}
function afterMove(){if(mode().id==='score'&&moves<=0){finish(true);return}if(mode().id!=='score'&&score>=mode().goal){finish(true);return}if(moves<=0){finish(false);return}if(!hasValidMove()){finish(false,'stuck');return}if(mode().id==='score')$('goalText').textContent=`🐟 残り ${moves} 手`;else $('goalText').textContent=`🎯 ${moves}手で ${mode().goal.toLocaleString()}点`}
function finish(win,reason=''){active=false;document.body.classList.remove('playing');const old=Number(localStorage.getItem(bestKey(modeId))||0);if(score>old){localStorage.setItem(bestKey(modeId),String(score));$('bestScore').textContent=score.toLocaleString()}$('startBtn').textContent='もう一度プレイ';$('startBtn').style.display='inline-block';$('giveUpBtn').style.display='none';$('modePick').querySelectorAll('button').forEach(b=>b.disabled=false);let gotCard=false;if(win&&current>=0&&modeId!=='score'&&score>=mode().goal&&!visited.includes(current)){visited.push(current);save();renderSpots();gotCard=true}const rewards=current>=0?spots[current].fish.map(i=>fishSet[i]):[];$('modalFish').innerHTML=gotCard?fishIcon(rewards[0].icon):fishIcon('iwashin');$('modalTitle').textContent=reason==='stuck'?'ゲームオーバー':reason==='giveup'?'プレイ終了':modeId==='score'?'スコアアタック終了':win?(gotCard?'おさかなカードをゲット！':'ステージクリア！'):'ゲームオーバー';let usedMoves=mode().moves-moves;let summary=`${mode().name}：<b>${score.toLocaleString()}点</b><br>使用手数：<b>${usedMoves} / ${mode().moves}手</b><br>最大連鎖：${maxCombo}コンボ／最大消し：${maxMatch}個／6個以上：${bigClears}回`;if(gotCard)summary+=`<br><br>${rewards.map(f=>'「'+f.name+'」').join('・')}を図鑑に登録したよ！<br>${rewards.map(f=>f.fact).join('<br>')}`;else if(win&&current>=0&&modeId==='score')summary+='<br><br>スコアアタックでは魚カードは獲得できません。目標モードで挑戦してね。';else if(reason==='stuck')summary+='<br><br>動かせる組み合わせがなくなったよ。盤面が詰んだためゲームオーバー！';else if(reason==='giveup')summary+='<br><br>このプレイを途中で終了しました。';else if(!win)summary+='<br><br>目標に届かなかったよ。連鎖や特殊コマを使って再挑戦！';if(visited.length===3&&gotCard)summary+='<br><br>氷見おさかなコース完成！イワシんマスターだ！';$('modalText').innerHTML=summary;$('modal').classList.add('show')}
$('startBtn').onclick=start;$('giveUpBtn').onclick=()=>{if(active&&confirm('このプレイを終了しますか？'))finish(false,'giveup')};$('hintBtn').onclick=()=>alert('となり合うピースを2つタップして入れ替えます。3個以上そろうと消えて得点！4個消しまたは2連鎖で行・列消し、5個消しまたは3連鎖で★が出現し、★をマッチで消すと同じ種類を全消し、6個以上または4連鎖以上で十字消しの特殊コマができます。特殊コマもマッチに巻き込んで消すと発動。新しくできた特殊コマは上から補充されるパネルに付くよ。連鎖は1連鎖ごとに100点×連鎖数、特殊コマの発動1回につき100点ボーナス。動かせる組み合わせがなくなるとゲームオーバー。途中で終了するときは「あきらめる」を押してね。');$('closeModal').onclick=()=>{$('modal').classList.remove('show');renderSpots()};$('resetBtn').onclick=()=>{if(confirm('集めたカードとスポット達成をリセットしますか？')){visited=[];current=-1;active=false;document.body.classList.remove('playing');save();$('gameTitle').textContent='海のパズルに挑戦！';$('gameSub').textContent='モードを選んで遊ぼう。スポット訪問で魚カードを集められるよ';$('routeLabel').textContent='氷見おさかなコース';$('fact').innerHTML='<b>イワシんの豆知識：</b>氷見では、マイワシ・カタクチイワシ・ウルメイワシが「氷見鰯」として親しまれているよ。';$('startBtn').textContent='このモードで開始';$('startBtn').style.display='inline-block';$('giveUpBtn').style.display='none';renderSpots();renderModes();newBoard();toast('図鑑とスポット達成をリセットしたよ')}};
renderModes();renderSpots();$('gameSub').textContent='モードを選んで遊ぼう。スポット訪問で魚カードを集められるよ';$('startBtn').textContent='このモードで開始';newBoard();
})();




</script></body></html>
